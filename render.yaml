services:
  - type: web
    name: bybit-pa-dashboard
    runtime: python
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: pip install -e .
    startCommand: uvicorn price_action_bot.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bybit-pa-db
          property: connectionString
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: BYBIT_DEMO
        value: "true"
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_API_SECRET
        sync: false
      - key: ENABLE_ORDER_PLACEMENT
        value: "false"
      - key: RUN_ENGINE_IN_WEB
        value: "true"
      - key: LEVERAGE
        value: "5"
      - key: RISK_PER_TRADE
        value: "0.01"
      - key: MAX_OPEN_POSITIONS
        value: "3"
      - key: MAX_TOTAL_OPEN_RISK
        value: "0.03"
      - key: DAILY_MAX_NET_LOSS
        value: "0.05"
      - key: MIN_REWARD_RISK
        value: "1.5"
      - key: VOLUME_MULTIPLIER
        value: "1.2"
      - key: UNIVERSE_SIZE
        value: "10"
      - key: POLL_SECONDS
        value: "20"
      - key: ORDER_RETRY_ATTEMPTS
        value: "3"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: bybit-pa-db
    databaseName: bybit_pa
    user: bybit_pa
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

previews:
  generation: off
